name: Watch internships

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Read job sources
        id: watcher
        continue-on-error: true
        run: npm run watch

      - name: Publish job data
        run: |
          git config user.name "internship-alerts-bot"
          git config user.email "internship-alerts-bot@users.noreply.github.com"
          bash scripts/publish-data.sh "${GITHUB_REF_NAME}"

      - name: Fail the run if a source failed
        if: steps.watcher.outcome == 'failure'
        run: |
          echo "One or more job sources failed. See the 'Read job sources' step."
          exit 1
